bind 0.0.0.0
protected-mode no
port 6379
dir /data

# Durability is preferred over write throughput for the first version.
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
save 900 1
save 300 10
save 60 10000

# Never evict pending tasks or results to make room for new writes.
maxmemory-policy noeviction
timeout 0
tcp-keepalive 60
