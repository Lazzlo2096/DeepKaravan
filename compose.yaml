name: deepkaravan

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${INFERENCE_DEVICE:-cpu}
    env_file: .env
    ports:
      - "${API_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - model-cache:/cache/huggingface
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 600s
      retries: 3

volumes:
  model-cache:
