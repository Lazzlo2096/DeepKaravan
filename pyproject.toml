[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "celery"]
markers = [
    "integration: requires a real Redis server (TEST_REDIS_URL)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["api", "common", "worker"]
known-third-party = ["celery", "redis"]
